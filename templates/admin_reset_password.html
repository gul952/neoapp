{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Reset password</h1>
  <p class="sub">Setting a new password for <strong>{{ target.full_name }}</strong> ({{ target.username }}).</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>New password <span>(at least 8 characters)</span></label>
    <input type="password" name="new_password" required autofocus>
    <button type="submit">Reset Password</button>
    &nbsp; <a class="btn btn-secondary" href="{{ url_for('admin.list_users') }}">Cancel</a>
  </form>
</div>
{% endblock %}
